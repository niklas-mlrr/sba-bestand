# Installierbares Paket, damit sba-dashboard es als Geschwister-Pfad einbinden
# kann ([tool.uv.sources] dort). Die Excel-Dateien in bestand/ sind Daten, kein
# Paketinhalt - setuptools nimmt nur die Python-Module auf.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sba-bestand"
version = "0.1.0"
description = "Excel-Tooling der Schulbuchausleihe: Bestands-/Nachbestellungsliste und Bücherlisten nach Fach"
requires-python = ">=3.10"
dependencies = [
    # Bestand (update_bestand*.py) und bestand/core/
    "openpyxl>=3.1,<4",
    "isbnlib>=3.10",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    # IServ-API-Client (Geschwister-Repo, siehe [tool.uv.sources])
    "iserv-ausleihe-api",
]

# reportlab (und das davon gezogene Pillow) braucht ausschliesslich der
# PDF-Erzeuger buecherlisten/generate_booklists.py. Als Pflichtabhaengigkeit
# haette sba-dashboard auf dem Schul-Laptop rund 15 MB Pakete installiert, die
# es nie importiert - und jede Installation waere an einem fehlenden Pillow-Rad
# gescheitert. Wer die Buecherlisten-PDFs braucht: `uv sync --extra pdf`
# bzw. `pip install "sba-bestand[pdf]"`.
[project.optional-dependencies]
pdf = ["reportlab>=4,<5"]

[dependency-groups]
dev = ["ruff>=0.8,<1", "pytest>=8,<9"]

# ausleihe-api wird als Geschwister-Repo geklont; identisches Muster wie in
# ausleihe-ausgabe/pyproject.toml.
[tool.uv.sources]
iserv-ausleihe-api = { path = "../ausleihe-api", editable = true }

[tool.setuptools.packages.find]
include = ["bestand*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
